[package]
name = "native_shim"
version = "1.3.0"
edition = "2024"
license = "MIT"

[dependencies]
# Polars py-2.2.0 plus one commit (branch polars-net/py-2.2.0 of our fork): polars-stream imports `io_sources` only
# with the `python` feature, so `io_plugin_ffi` (the managed scans' IO plugin bridge) does not compile without it.
# Every Polars crate must come from this one source.
polars = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da", features = ["async","lazy", "csv","parquet","strings","regex","cloud","dot_product","dot_diagram","mode","interpolate","interpolate_by",
"timezones","semi_anti_join","cross_join","iejoin","is_between","is_in","is_unique","log","random","array_arithmetic","list_arithmetic","reinterpret",
"abs","round_series","dtype-full","array_to_struct","pivot","sql","diff","rolling_window","rolling_window_by","repeat_by",
"json","ipc","asof_join","diagonal_concat","top_k","rank","moment","pct_change","ewma","ewma_by","product","arg_where","fmt","ipc_streaming",
"aws","azure","gcp","http","dynamic_group_by","business","search_sorted","bitwise","index_of","simd","row_hash","approx_unique","merge_sorted","partition_by",
"to_dummies","is_first_distinct","is_last_distinct","unique_counts","propagate_nans","array_count","list_count","list_drop_nulls","list_sample",
"list_gather","list_to_struct","list_sets","find_many","concat_str","extract_groups","string_pad","string_encoding", "string_normalize","string_reverse",
"string_to_integer","extract_jsonpath","month_start","month_end","zip_with","rle","replace","cutqcut","peaks","dtype-extension","is_close","hist"] }
polars-core = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-arrow = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-io = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" ,features =["file_cache"] }
polars-parquet = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-utils = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-buffer = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-plan = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-ops = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-async = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
polars-config = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da" }
# Managed readers as Polars IO plugins (file_reader.v1 / lazyframe_resolver.v1): the `polars` facade has no feature
# for it, so the lazy crate and the contract crate are named directly (features unify with the facade's).
polars-lazy = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da", features = ["io_plugin_ffi"] }
polars-io-ext-ffi = { git = "https://github.com/ErrorLSC/polars", rev = "13427ae71d3d1c66d38bce53d0961821010231da", features = ["lazyframe_resolver"] }
flate2 = { version = "1.1.8", features = ["rust_backend"] }
object_store = "0.14"
futures = "*"
rand = "*"
regex-syntax = "*"
ryu = "1.0.23"
ethnum = "1.5"
[lib]
crate-type = ["cdylib"]

# Debug
[profile.dev]       
strip = true 
opt-level = 0        
panic = "unwind"      
lto = false
codegen-units = 16 
debug-assertions = false 
overflow-checks = false

# Release:
[profile.release]
strip = true        #  Strip symbols
opt-level = 3       # Max :3
lto = "fat"          # Link time optimize
codegen-units = 1   # set 1 for better binary layout
panic = "unwind"     

# Polars' own workspace patch at py-2.2.0 (also in the fork) (a git dependency does not inherit it): its hashbrown fork adds the
# prefetch_* methods polars-expr calls.
[patch.crates-io]
hashbrown = { git = "https://github.com/pola-rs/hashbrown", rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a" }
