[package]
name = "native_shim"
version = "0.7.0"
edition = "2024"
license = "MIT"

[dependencies]
polars = { version = "0.55.2", features = ["lazy", "csv","parquet","strings","regex","cloud","dot_product","dot_diagram","mode","interpolate","interpolate_by",
"timezones","semi_anti_join","cross_join","iejoin","is_between","is_in","is_unique","log","random","array_arithmetic","list_arithmetic","reinterpret",
"abs","round_series","dtype-full","array_to_struct","pivot","sql","diff","rolling_window","rolling_window_by","avro","repeat_by",
"json","ipc","asof_join","diagonal_concat","top_k","rank","moment","pct_change","ewma","ewma_by","product","arg_where","fmt","ipc_streaming",
"aws","azure","gcp","http","dynamic_group_by","business","search_sorted","bitwise","index_of","simd","row_hash","approx_unique","merge_sorted","partition_by",
"to_dummies","is_first_distinct","is_last_distinct","unique_counts","propagate_nans","array_count","list_count","list_drop_nulls","list_sample",
"list_gather","list_to_struct","list_sets","find_many","concat_str","extract_groups","string_pad","string_encoding", "string_normalize","string_reverse",
"string_to_integer","extract_jsonpath","month_start","month_end","zip_with","rle","replace","cutqcut","peaks","dtype-extension","is_close","hist"] }
polars-core = { version = "0.55.2" }
polars-arrow = { version = "0.55.2" }
polars-io = { version = "0.55.2",features =["file_cache","catalog"] }
polars-utils = { version = "0.55.2" }
polars-buffer = {version="0.55.2"}
polars-plan = {version="0.55.2"}
polars-ops = {version="0.55.2"}
polars-async = {version="0.55.2"}
polars-config = {version="0.55.2"}
flate2 = { version = "1.1.8", features = ["rust_backend"] }
serde_json = "*"
calamine = { version = "0.36.1", features = ["dates","chrono"] }
chrono = "0.4.41"
rust_xlsxwriter = { version = "0.95", features = ["chrono"] }
mimalloc = { version = "*", default-features = false }
deltalake = { version = "0.32.4", default-features = false, features = ["s3", "azure", "gcs", "rustls"] }
tokio = { version = "1.49.0"}
url = "2.5.8"
uuid = {version="1.20.0", features=["v4"]}
futures = "0.3.31"
urlencoding = "2.1.3"
rand = "0.10.0"
roaring = "0.11.3"
z85 = "3.0.7"
[lib]
crate-type = ["cdylib"]

# Debug
[profile.dev]       
strip = true 
opt-level = 0        
panic = "unwind"      
lto = false
codegen-units = 16 
debug-assertions = false 
overflow-checks = false

# Release:
[profile.release]
strip = true        #  Strip symbols
opt-level = 3       # Max :3
lto = "fat"          # Link time optimize
codegen-units = 1   # set 1 for better binary layout
panic = "unwind"     
